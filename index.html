<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Notification Dashboard</title>
    <style>
        :root {
            --bg-color: #0c0d10;
            --surface-color: rgba(22, 24, 31, 0.85);
            --border-color: rgba(255, 255, 255, 0.08);
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --accent-color: #3b82f6;
            --danger-color: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            overflow-x: hidden;
        }

        .notification-container {
            width: 100%;
            max-width: 400px;
            margin-top: 12px;
            perspective: 1000px;
        }

        .notification-card {
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 
                        0 1px 3px rgba(255, 255, 255, 0.03) inset;
            transform-origin: top center;
            animation: slideInDown 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transition: all 0.3s ease;
        }

        .notification-card.dismissed {
            transform: scale(0.9) translateY(-40px);
            opacity: 0;
            pointer-events: none;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .app-identity {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .app-icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-weight: bold;
            font-size: 14px;
        }

        .app-name {
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
        }

        .timestamp {
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 400;
        }

        .content {
            margin-bottom: 16px;
        }

        .message-title {
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 4px;
        }

        .message-body {
            color: var(--text-secondary);
            font-size: 14px;
            line-height: 1.4;
        }

        .actions {
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 14px;
        }

        .btn {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        .btn:active {
            background: rgba(255, 255, 255, 0.08);
            transform: scale(0.98);
        }

        .btn-primary {
            background: rgba(59, 130, 246, 0.15);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.1);
        }

        .btn-primary:active {
            background: rgba(59, 130, 246, 0.25);
        }

        .details-tray {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s cubic-bezier(0.16, 1, 0.3, 1), margin-top 0.3s ease;
            background: rgba(0, 0, 0, 0.15);
            border-radius: 14px;
        }

        .details-tray.expanded {
            max-height: 200px;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .details-grid {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 16px;
            font-size: 13px;
        }

        .details-label {
            color: var(--text-secondary);
        }

        .details-value {
            color: var(--text-primary);
            text-align: right;
            font-family: monospace;
        }

        @keyframes slideInDown {
            from {
                transform: translateY(-20px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>

    <div class="notification-container">
        <div class="notification-card" id="notification">
            <div class="header">
                
                    <div class="app-icon">₹</div>
                    <div class="app-name">Wallet Alert</div>
                </div>
                <div class="timestamp" id="live-time">Just now</div>
            </div>
            
            <div class="content">
                <div class="message-title">Transaction Update</div>
                <div class="message-body"><strong>₹100</strong> debited from your account.</div>
            </div>

            <div class="actions">
                <button class="btn" id="dismiss-btn">Dismiss</button>
                <button class="btn btn-primary" id="details-btn">View details</button>
            </div>

            <div class="details-tray" id="details-tray">
                <div class="details-grid">
                    <div class="details-label">Status</div>
                    <div class="details-value" style="color: #4ade80;">Success</div>
                    
                    <div class="details-label">Date</div>
                    <div class="details-value" id="current-date">--/--/----</div>
                    
                    <div class="details-label">Channel</div>
                    <div class="details-value">NFC Secure Link</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateDateTime() {
            const now = new Date();
            
            // Format dynamic clock time (e.g., 11:24 AM)
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            document.getElementById('live-time').textContent = `${hours}:${minutes} ${ampm}`;

            // Format dynamic metadata card date (e.g., 14 Oct 2026)
            const day = now.getDate();
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            document.getElementById('current-date').textContent = `${day} ${month} ${year}`;
        }

        updateDateTime();

        const detailsBtn = document.getElementById('details-btn');
        const detailsTray = document.getElementById('details-tray');
        const dismissBtn = document.getElementById('dismiss-btn');
        const notification = document.getElementById('notification');

        detailsBtn.addEventListener('click', () => {
            detailsTray.classList.toggle('expanded');
            detailsBtn.textContent = detailsTray.classList.contains('expanded') ? 'Hide details' : 'View details';
        });

        dismissBtn.addEventListener('click', () => {
            notification.classList.add('dismissed');
        });
    </script>
</body>
</html>
